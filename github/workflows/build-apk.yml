name: Build Masar APK

on:
  push:
    branches: [ main, master ]
  release:
    types: [ published, created, edited ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web app source in www/
        run: |
          mkdir -p www
          if [ -f "Masar_Enhanced.html" ]; then
            cp "Masar_Enhanced.html" "www/index.html"
          elif [ -f "Masar_Enhanced (1).html" ]; then
            cp "Masar_Enhanced (1).html" "www/index.html"
          elif [ -f "index.html" ]; then
            cp "index.html" "www/index.html"
          else
            echo "No HTML file found in repository root"
            exit 1
          fi

      - name: Initialize Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "مسار" "com.msh3aan.masar" --web-dir www
          npx cap add android
          npx cap copy android

      - name: Configure app name and release signing
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">مسار<\/string>/g' android/app/src/main/res/values/strings.xml
          cat << 'EOF' > android/keystore.properties
          storeFile=masar-release.keystore
          storePassword=masar_release_pass_2026
          keyAlias=masar_key
          keyPassword=masar_release_pass_2026
          EOF
          keytool -genkeypair -v \
            -keystore android/masar-release.keystore \
            -alias masar_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass masar_release_pass_2026 \
            -keypass masar_release_pass_2026 \
            -dname "CN=Masar, OU=App, O=Msh3aan, L=Riyadh, S=Riyadh, C=SA"
          node -e '
          const fs = require("fs");
          const gradlePath = "android/app/build.gradle";
          let gradle = fs.readFileSync(gradlePath, "utf8");
          if (!gradle.includes("signingConfigs")) {
            gradle = gradle.replace(
              "buildTypes {",
              `signingConfigs {
                release {
                  storeFile file("../masar-release.keystore")
                  storePassword "masar_release_pass_2026"
                  keyAlias "masar_key"
                  keyPassword "masar_release_pass_2026"
                }
              }
              buildTypes {`
            );
          }
          gradle = gradle.replace(
            /release\s*{/,
            `release {
              signingConfig signingConfigs.release`
          );
          fs.writeFileSync(gradlePath, gradle, "utf8");
          '

      - name: Build signed APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../masar.apk

      - name: Upload APK to current or latest Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          files: masar.apk
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || 'v2.0' }}
          make_latest: true
