name: Build Masar APK

on:
  push:
    branches: [ main, master ]
  release:
    types: [ published, created, edited ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK environment
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/cmdline-tools/tools/bin" >> "$GITHUB_PATH"
          CMDLINE_BIN=""
          if command -v sdkmanager >/dev/null 2>&1; then
            CMDLINE_BIN="sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE_BIN="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/tools/bin/sdkmanager" ]; then
            CMDLINE_BIN="$SDK_ROOT/cmdline-tools/tools/bin/sdkmanager"
          fi
          if [ -n "$CMDLINE_BIN" ]; then
            yes | "$CMDLINE_BIN" --licenses >/dev/null 2>&1 || true
            "$CMDLINE_BIN" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "Warning: sdkmanager not found, relying on preinstalled SDK in $SDK_ROOT"
          fi

      - name: Prepare web app source in www/
        run: |
          mkdir -p www
          if [ -f "app/index.html" ]; then
            cp "app/index.html" "www/index.html"
          elif [ -f "Masar_Enhanced (2).html" ]; then
            cp "Masar_Enhanced (2).html" "www/index.html"
          elif [ -f "Masar_Enhanced.html" ]; then
            cp "Masar_Enhanced.html" "www/index.html"
          elif [ -f "index.html" ]; then
            cp "index.html" "www/index.html"
          else
            echo "No HTML file found in app/ or repository root"
            exit 1
          fi

      - name: Initialize Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "مسار" "com.msh3aan.masar" --web-dir www
          npx cap add android
          npx cap copy android

      - name: Configure app name, Kotlin BOM and release signing
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">مسار<\/string>/g' android/app/src/main/res/values/strings.xml

          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.9.22"))
          }
          EOF

          keytool -genkeypair -v \
            -keystore android/masar-release.keystore \
            -alias masar_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass masar_release_pass_2026 \
            -keypass masar_release_pass_2026 \
            -dname "CN=Masar, OU=App, O=Msh3aan, L=Riyadh, S=Riyadh, C=SA"

          cat << 'EOF' > android/app/signing.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file("../masar-release.keystore")
                      storePassword "masar_release_pass_2026"
                      keyAlias "masar_key"
                      keyPassword "masar_release_pass_2026"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

          echo "apply from: 'signing.gradle'" >> android/app/build.gradle

      - name: Build signed APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../masar.apk

      - name: Upload APK to current or latest Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          files: masar.apk
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || 'v2.0.0' }}
          make_latest: true
